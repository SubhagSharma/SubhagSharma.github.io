<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, deleteDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ⚠️ CRITICAL: Replace with your actual Firebase config keys ⚠️
  const firebaseConfig = {

    apiKey: "AIzaSyBjIgZGfD-BXW8f0t7MKis0MULrOQPZPPE",

    authDomain: "subhag-blog.firebaseapp.com",

    projectId: "subhag-blog",

    storageBucket: "subhag-blog.firebasestorage.app",

    messagingSenderId: "467758922508",

    appId: "1:467758922508:web:a554e5e042fe5472c9e729",

    measurementId: "G-MFQS21SR9B"

  };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let quill;
        document.addEventListener("DOMContentLoaded", () => {
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Write your post here...',
                modules: {
                    toolbar: {
                        container: [
                            [{ 'font': [] }, { 'size': ['small', false, 'large', 'huge'] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'color': [] }, { 'background': [] }],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['link', 'image', 'clean']
                        ],
                        handlers: {
                            // NEW: GitHub API Image Uploader
                            'image': function() {
                                const input = document.createElement('input');
                                input.setAttribute('type', 'file');
                                input.setAttribute('accept', 'image/*');
                                input.click();

                                input.onchange = async () => {
                                    const file = input.files[0];
                                    if (!file) return;

                                    // Securely get the GitHub token from local browser storage
                                    let ghToken = localStorage.getItem('gh_token');
                                    if (!ghToken) {
                                        ghToken = prompt('Enter your GitHub Fine-Grained Access Token:');
                                        if (!ghToken) return;
                                        localStorage.setItem('gh_token', ghToken);
                                    }

                                    const statusEl = document.getElementById('post-status');
                                    statusEl.className = "text-blue-500 font-medium";
                                    statusEl.textContent = "Committing image to GitHub...";

                                    const reader = new FileReader();
                                    reader.readAsDataURL(file);
                                    reader.onload = async () => {
                                        // Strip the data URL prefix to get pure base64
                                        const base64Content = reader.result.split(',')[1];
                                        // Create a unique, URL-safe filename
                                        const fileName = Date.now() + '-' + file.name.replace(/\s+/g, '-');
                                        const filePath = `static/blog/images/${fileName}`;
                                        const repo = 'SubhagSharma/subhagsharma.github.io'; 

                                        try {
                                            const response = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
                                                method: 'PUT',
                                                headers: {
                                                    'Authorization': `Bearer ${ghToken}`,
                                                    'Accept': 'application/vnd.github+json',
                                                    'Content-Type': 'application/json',
                                                },
                                                body: JSON.stringify({
                                                    message: `Upload ${fileName} via Admin Panel`,
                                                    content: base64Content
                                                })
                                            });

                                            if (!response.ok) {
                                                if (response.status === 401) {
                                                    localStorage.removeItem('gh_token');
                                                    throw new Error("Invalid or expired GitHub token. Refresh and try again.");
                                                }
                                                throw new Error("GitHub API Error: " + response.statusText);
                                            }

                                            // Insert the raw GitHub URL so it loads instantly in the editor
                                            const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${filePath}`;
                                            const range = this.quill.getSelection(true);
                                            this.quill.insertEmbed(range.index, 'image', rawUrl);
                                            
                                            statusEl.className = "text-green-500 font-medium";
                                            statusEl.textContent = "Image committed to GitHub!";
                                            setTimeout(() => statusEl.textContent = "", 3000);
                                        } catch (error) {
                                            statusEl.className = "text-red-500 font-medium";
                                            statusEl.textContent = "Upload failed: " + error.message;
                                        }
                                    };
                                };
                            }
                        }
                    }
                }
            });
        });

        // --- Keep the rest of your functions (loadAdminPosts, deletePost, Auth state, Form Submit) exactly as they were below this point ---

        async function loadAdminPosts() {
            const postsList = document.getElementById('admin-posts-list');
            try {
                const q = query(collection(db, "posts"), orderBy("date", "desc"));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    postsList.innerHTML = '<p class="text-sm text-gray-500 dark:text-gray-400">No posts published yet.</p>';
                    return;
                }

                let html = '';
                snapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const date = post.date ? new Date(post.date.toDate()).toLocaleDateString() : 'Just now';
                    
                    html += `
                        <div class="flex justify-between items-center bg-gray-50 dark:bg-[#18191a] p-4 rounded-lg border border-gray-200 dark:border-[#3a3b3c]">
                            <div>
                                <p class="font-bold text-gray-900 dark:text-white text-sm">${post.title}</p>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${date}</p>
                            </div>
                            <button onclick="deletePost('${docSnap.id}')" class="text-xs font-bold bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 dark:hover:bg-red-900/50 px-3 py-1.5 rounded transition">
                                Delete
                            </button>
                        </div>
                    `;
                });
                postsList.innerHTML = html;
            } catch (error) {
                postsList.innerHTML = '<p class="text-sm text-red-500">Error loading posts.</p>';
            }
        }

        window.deletePost = async function(id) {
            if (!confirm("Are you sure you want to delete this post? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, "posts", id));
                loadAdminPosts(); 
            } catch (error) {
                alert("Error deleting post: " + error.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginSection = document.getElementById('login-section');
            const editorSection = document.getElementById('editor-section');
            const userEmail = document.getElementById('user-email');

            if (user) {
                loginSection.classList.add('hidden');
                editorSection.classList.remove('hidden');
                userEmail.textContent = user.email;
                loadAdminPosts();
            } else {
                loginSection.classList.remove('hidden');
                editorSection.classList.add('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            try {
                errorEl.textContent = '';
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorEl.textContent = "Authentication failed: " + error.message;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('post-title').value;
            const content = quill.root.innerHTML; 
            const statusEl = document.getElementById('post-status');
            
            const rawTags = document.getElementById('post-tags') ? document.getElementById('post-tags').value : '';
            const tagsArray = rawTags.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            if (quill.getText().trim().length === 0 && !content.includes('<img')) {
                statusEl.className = "text-red-500 font-medium";
                statusEl.textContent = "Post content cannot be empty.";
                return;
            }

            try {
                statusEl.className = "text-blue-500 font-medium";
                statusEl.textContent = "Publishing...";

                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    tags: tagsArray,
                    date: serverTimestamp()
                });

                statusEl.className = "text-green-500 font-medium";
                statusEl.textContent = "Post published successfully!";
                document.getElementById('post-form').reset();
                quill.setContents([]); 
                loadAdminPosts(); 
            } catch (error) {
                statusEl.className = "text-red-500 font-medium";
                statusEl.textContent = "Error publishing post: " + error.message;
            }
        });
    </script>
