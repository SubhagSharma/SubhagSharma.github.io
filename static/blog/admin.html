<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin | Subhag Sharma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <style>
        .ql-toolbar { border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; transition: background-color 0.3s, border-color 0.3s; }
        .ql-container { font-size: 16px; border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; height: 350px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
        html:not(.dark) .ql-toolbar { background-color: #f9fafb; border-color: #e5e7eb !important; }
        html:not(.dark) .ql-container { background-color: #ffffff; color: #111827; border-color: #e5e7eb !important; }
        html.dark .ql-toolbar { background-color: #242526; border-color: #3a3b3c !important; }
        html.dark .ql-container { background-color: #18191a; color: #e4e6eb; border-color: #3a3b3c !important; }
        html.dark .ql-picker-label { color: #a9a9b3; }
        html.dark .ql-stroke { stroke: #a9a9b3; }
        html.dark .ql-fill { fill: #a9a9b3; }
        html.dark .ql-picker-options { background-color: #242526; border-color: #3a3b3c; }
        html.dark .ql-snow .ql-picker.ql-expanded .ql-picker-options { border-color: #555; }
        /* Quill Line Spacing Dropdown UI */
        .ql-snow .ql-picker.ql-lineHeight { width: 130px; }
        .ql-snow .ql-picker.ql-lineHeight .ql-picker-label::before,
        .ql-snow .ql-picker.ql-lineHeight .ql-picker-item::before { content: 'Spacing: Single'; }
        .ql-snow .ql-picker.ql-lineHeight .ql-picker-item[data-value="1.0"]::before { content: 'Spacing: Single'; }
        .ql-snow .ql-picker.ql-lineHeight .ql-picker-label[data-value="1.5"]::before,
        .ql-snow .ql-picker.ql-lineHeight .ql-picker-item[data-value="1.5"]::before { content: 'Spacing: 1.5'; }
        .ql-snow .ql-picker.ql-lineHeight .ql-picker-label[data-value="2.0"]::before,
        .ql-snow .ql-picker.ql-lineHeight .ql-picker-item[data-value="2.0"]::before { content: 'Spacing: Double'; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        // NEW: Imported updateDoc to handle edits
        import { getFirestore, collection, addDoc, serverTimestamp, doc, deleteDoc, getDocs, query, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ⚠️ CRITICAL: Replace with your actual Firebase config keys ⚠️
       const firebaseConfig = {

    apiKey: "AIzaSyBjIgZGfD-BXW8f0t7MKis0MULrOQPZPPE",

    authDomain: "subhag-blog.firebaseapp.com",

    projectId: "subhag-blog",

    storageBucket: "subhag-blog.firebasestorage.app",

    messagingSenderId: "467758922508",

    appId: "1:467758922508:web:a554e5e042fe5472c9e729",

    measurementId: "G-MFQS21SR9B"

  };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let quill;
        let editingPostId = null; // Tracks if we are editing an existing post
        window.allPostsData = {}; // Stores post data locally for quick loading into the editor
        

        document.addEventListener("DOMContentLoaded", () => {
            // NEW: Register Line Spacing with Quill
            const Parchment = Quill.import('parchment');
            const LineHeightStyle = new Parchment.Attributor.Style('lineHeight', 'line-height', {
                scope: Parchment.Scope.BLOCK,
                whitelist: ['1.0', '1.5', '2.0']
            });
            Quill.register(LineHeightStyle, true);            
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Write your post here...',
                modules: {
                    toolbar: {
                        container: [
                            [{ 'font': [] }, { 'size': ['small', false, 'large', 'huge'] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'color': [] }, { 'background': [] }],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['link', 'image', 'clean']
                        ],
                        handlers: {
                            'image': function() {
                                const input = document.createElement('input');
                                input.setAttribute('type', 'file');
                                input.setAttribute('accept', 'image/*');
                                input.click();

                                input.onchange = async () => {
                                    const file = input.files[0];
                                    if (!file) return;

                                    let ghToken = localStorage.getItem('gh_token');
                                    if (!ghToken) {
                                        ghToken = prompt('Enter your GitHub Fine-Grained Access Token:');
                                        if (!ghToken) return;
                                        localStorage.setItem('gh_token', ghToken);
                                    }

                                    const statusEl = document.getElementById('post-status');
                                    statusEl.className = "text-blue-500 font-medium";
                                    statusEl.textContent = "Committing image to GitHub...";

                                    const reader = new FileReader();
                                    reader.readAsDataURL(file);
                                    reader.onload = async () => {
                                        const base64Content = reader.result.split(',')[1];
                                        const fileName = Date.now() + '-' + file.name.replace(/\s+/g, '-');
                                        const filePath = `static/blog/images/${fileName}`;
                                        
                                        const repo = 'SubhagSharma/subhagsharma.github.io'; 

                                        try {
                                            const response = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
                                                method: 'PUT',
                                                headers: {
                                                    'Authorization': `Bearer ${ghToken}`,
                                                    'Accept': 'application/vnd.github+json',
                                                    'Content-Type': 'application/json',
                                                },
                                                body: JSON.stringify({
                                                    message: `Upload ${fileName} via Admin Panel`,
                                                    content: base64Content
                                                })
                                            });

                                            if (!response.ok) {
                                                if (response.status === 401) {
                                                    localStorage.removeItem('gh_token');
                                                    throw new Error("Invalid or expired GitHub token. Refresh and try again.");
                                                }
                                                throw new Error("GitHub API Error: " + response.statusText);
                                            }

                                            const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${filePath}`;
                                            const range = this.quill.getSelection(true);
                                            this.quill.insertEmbed(range.index, 'image', rawUrl);
                                            
                                            statusEl.className = "text-green-500 font-medium";
                                            statusEl.textContent = "Image committed to GitHub!";
                                            setTimeout(() => statusEl.textContent = "", 3000);
                                        } catch (error) {
                                            statusEl.className = "text-red-500 font-medium";
                                            statusEl.textContent = "Upload failed: " + error.message;
                                        }
                                    };
                                };
                            }
                        }
                    }
                }
            });
        });

        async function loadAdminPosts() {
            const postsList = document.getElementById('admin-posts-list');
            try {
                const q = query(collection(db, "posts"), orderBy("date", "desc"));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    postsList.innerHTML = '<p class="text-sm text-gray-500 dark:text-gray-400">No posts published yet.</p>';
                    return;
                }

                let html = '';
                window.allPostsData = {}; // Reset local storage on load

                snapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    window.allPostsData[docSnap.id] = post; // Save post data to memory
                    
                    const date = post.date ? new Date(post.date.toDate()).toLocaleDateString() : 'Just now';
                    
                    html += `
                        <div class="flex justify-between items-center bg-gray-50 dark:bg-[#18191a] p-4 rounded-lg border border-gray-200 dark:border-[#3a3b3c]">
                            <div>
                                <p class="font-bold text-gray-900 dark:text-white text-sm">${post.title}</p>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${date}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="editPost('${docSnap.id}')" class="text-xs font-bold bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-200 dark:hover:bg-blue-900/50 px-3 py-1.5 rounded transition">
                                    Edit
                                </button>
                                <button onclick="deletePost('${docSnap.id}')" class="text-xs font-bold bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 dark:hover:bg-red-900/50 px-3 py-1.5 rounded transition">
                                    Delete
                                </button>
                            </div>
                        </div>
                    `;
                });
                postsList.innerHTML = html;
            } catch (error) {
                postsList.innerHTML = '<p class="text-sm text-red-500">Error loading posts.</p>';
            }
        }

        // NEW: Load a post into the editor
        window.editPost = function(id) {
            const post = window.allPostsData[id];
            if (!post) return;

            editingPostId = id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-tags').value = post.tags ? post.tags.join(', ') : '';
            quill.root.innerHTML = post.content;
            
            document.getElementById('form-title').textContent = "Edit Post";
            document.getElementById('submit-btn').textContent = "Update Post";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            
            // Scroll to the top of the editor smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // NEW: Clear the editor and return to Create mode
        window.cancelEdit = function() {
            editingPostId = null;
            document.getElementById('post-form').reset();
            quill.setContents([]);
            
            document.getElementById('form-title').textContent = "Create New Post";
            document.getElementById('submit-btn').textContent = "Publish Post";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.getElementById('post-status').textContent = "";
        };

        window.deletePost = async function(id) {
            if (!confirm("Are you sure you want to delete this post? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, "posts", id));
                if (editingPostId === id) cancelEdit(); // Clear editor if deleting the post being edited
                loadAdminPosts(); 
            } catch (error) {
                alert("Error deleting post: " + error.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginSection = document.getElementById('login-section');
            const editorSection = document.getElementById('editor-section');
            const userEmail = document.getElementById('user-email');

            if (user) {
                loginSection.classList.add('hidden');
                editorSection.classList.remove('hidden');
                userEmail.textContent = user.email;
                loadAdminPosts();
            } else {
                loginSection.classList.remove('hidden');
                editorSection.classList.add('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            try {
                errorEl.textContent = '';
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorEl.textContent = "Authentication failed: " + error.message;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('post-title').value;
            const content = quill.root.innerHTML; 
            const statusEl = document.getElementById('post-status');
            
            const rawTags = document.getElementById('post-tags') ? document.getElementById('post-tags').value : '';
            const tagsArray = rawTags.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            if (quill.getText().trim().length === 0 && !content.includes('<img')) {
                statusEl.className = "text-red-500 font-medium";
                statusEl.textContent = "Post content cannot be empty.";
                return;
            }

            try {
                statusEl.className = "text-blue-500 font-medium";
                statusEl.textContent = editingPostId ? "Updating..." : "Publishing...";

                if (editingPostId) {
                    // Update existing post
                    await updateDoc(doc(db, "posts", editingPostId), {
                        title: title,
                        content: content,
                        tags: tagsArray
                    });
                    statusEl.className = "text-green-500 font-medium";
                    statusEl.textContent = "Post updated successfully!";
                    setTimeout(cancelEdit, 1500); // Clear editor and return to normal mode
                } else {
                    // Create new post
                    await addDoc(collection(db, "posts"), {
                        title: title,
                        content: content,
                        tags: tagsArray,
                        date: serverTimestamp()
                    });
                    statusEl.className = "text-green-500 font-medium";
                    statusEl.textContent = "Post published successfully!";
                    document.getElementById('post-form').reset();
                    quill.setContents([]); 
                }
                
                loadAdminPosts(); 
            } catch (error) {
                statusEl.className = "text-red-500 font-medium";
                statusEl.textContent = "Error saving post: " + error.message;
            }
        });
    </script>
</head>
<body class="bg-[#fafafa] dark:bg-[#1d1e20] text-gray-900 dark:text-[#a9a9b3] min-h-screen flex flex-col transition-colors duration-300 selection:bg-gray-300 dark:selection:bg-gray-700">

    <header class="max-w-4xl w-full mx-auto px-6 py-6 flex justify-between items-center border-b border-gray-200 dark:border-[#333]">
        <a href="/" class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight hover:opacity-80 transition">Subhag Sharma</a>
        <div class="flex items-center space-x-6">
            <nav class="space-x-4 text-sm font-medium">
                <a href="/" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">Portfolio</a>
                <a href="/blog/" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">Blog</a>
            </nav>
            <button onclick="toggleTheme()" class="p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-800 transition" title="Toggle Theme">
                <svg class="w-5 h-5 text-gray-800 dark:text-gray-200 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
                <svg class="w-5 h-5 text-gray-800 dark:text-gray-200 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center p-6 mb-10">
        
        <div id="login-section" class="w-full max-w-md mt-10 bg-white dark:bg-[#242526] p-8 rounded-xl border border-gray-200 dark:border-[#3a3b3c] shadow-md">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6 text-center">Blog Admin</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1">Email</label>
                    <input type="email" id="email" required class="w-full bg-gray-50 dark:bg-[#18191a] border border-gray-300 dark:border-[#3a3b3c] rounded-lg px-4 py-2 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-gray-50 dark:bg-[#18191a] border border-gray-300 dark:border-[#3a3b3c] rounded-lg px-4 py-2 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div id="login-error" class="text-red-500 text-sm"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                    Sign In
                </button>
            </form>
        </div>

        <div id="editor-section" class="w-full max-w-4xl bg-white dark:bg-[#242526] p-8 rounded-xl border border-gray-200 dark:border-[#3a3b3c] shadow-md hidden space-y-8">
            
            <div>
                <div class="flex justify-between items-center border-b border-gray-200 dark:border-[#3a3b3c] pb-4 mb-6">
                    <div>
                        <h1 id="form-title" class="text-2xl font-bold text-gray-900 dark:text-white">Create New Post</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Logged in as <span id="user-email" class="text-blue-500"></span></p>
                    </div>
                    <button id="logout-btn" class="text-xs bg-gray-200 dark:bg-[#3a3b3c] hover:bg-gray-300 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg transition">
                        Sign Out
                    </button>
                </div>

                <form id="post-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Post Title</label>
                        <input type="text" id="post-title" required class="w-full bg-gray-50 dark:bg-[#18191a] border border-gray-300 dark:border-[#3a3b3c] rounded-lg px-4 py-3 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tags (comma separated)</label>
                        <input type="text" id="post-tags" placeholder="e.g. Technical, XAI, Ragebait" class="w-full bg-gray-50 dark:bg-[#18191a] border border-gray-300 dark:border-[#3a3b3c] rounded-lg px-4 py-2 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Content</label>
                        <div id="editor-container"></div>
                    </div>

                    <div class="flex justify-between items-center pt-4">
                        <span id="post-status" class="text-sm"></span>
                        <div class="space-x-3">
                            <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden bg-gray-200 hover:bg-gray-300 dark:bg-[#3a3b3c] dark:hover:bg-[#4a4b4c] text-gray-800 dark:text-white font-medium py-2.5 px-6 rounded-lg transition duration-200">
                                Cancel
                            </button>
                            <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-8 rounded-lg transition duration-200">
                                Publish Post
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="pt-8 border-t border-gray-200 dark:border-[#3a3b3c]">
                <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Manage Published Posts</h2>
                <div id="admin-posts-list" class="space-y-3">
                    <p class="text-sm text-gray-500">Loading posts...</p>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
