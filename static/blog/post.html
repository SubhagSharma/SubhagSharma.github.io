<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post | Subhag Sharma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjIgZGfD-BXW8f0t7MKis0MULrOQPZPPE",
            authDomain: "subhag-blog.firebaseapp.com",
            projectId: "subhag-blog",
            storageBucket: "subhag-blog.firebasestorage.app",
            messagingSenderId: "467758922508",
            appId: "1:467758922508:web:a554e5e042fe5472c9e729",
            measurementId: "G-MFQS21SR9B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        function loadSinglePost() {
            const container = document.getElementById('post-container');
            if (!postId) {
                container.innerHTML = '<p class="text-red-500">Post not found.</p>';
                return;
            }

            const docRef = doc(db, "posts", postId);
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const post = docSnap.data();
                    const dateString = post.date ? new Date(post.date.toDate()).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Recent';
                    document.title = `${post.title} | Subhag Sharma`;
                    
                    let tagsHtml = '';
                    if (post.tags && post.tags.length > 0) {
                        tagsHtml = '<div class="flex flex-wrap gap-2 mt-4">';
                        post.tags.forEach(tag => {
                            tagsHtml += `<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded dark:bg-[#2d3748] dark:text-blue-300 border border-blue-200 dark:border-[#4a5568]">${tag}</span>`;
                        });
                        tagsHtml += '</div>';
                    }
                    
                    container.innerHTML = `
                        <header class="mb-8 border-b border-gray-200 dark:border-[#3a3b3c] pb-6">
                            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-2">${post.title}</h1>
                            <time class="text-sm text-gray-500 dark:text-gray-400">${dateString}</time>
                            ${tagsHtml}
                        </header>
                        <div class="prose prose-invert max-w-none text-gray-800 dark:text-gray-300 leading-loose space-y-4">
                            ${post.content}
                        </div>
                    `;
                } else {
                    container.innerHTML = '<p class="text-red-500">Post does not exist or was deleted.</p>';
                }
            }, (error) => {
                container.innerHTML = `<p class="text-red-500">Error loading post: ${error.message}</p>`;
            });

            loadComments();
        }

        // --- Custom Comment System Logic ---
        
        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            const commentForm = document.getElementById('comment-form');
            const userInfo = document.getElementById('user-info');
            const userName = document.getElementById('user-name');

            if (user) {
                loginBtn.classList.add('hidden');
                commentForm.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userName.textContent = user.displayName || user.email;
            } else {
                loginBtn.classList.remove('hidden');
                commentForm.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        window.loginWithGoogle = async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert("Error signing in: " + error.message); }
        };

        window.logout = () => signOut(auth);

        window.submitComment = async (e) => {
            e.preventDefault();
            const textInput = document.getElementById('comment-text');
            const text = textInput.value.trim();
            if (!text || !postId || !auth.currentUser) return;

            const btn = document.getElementById('submit-comment-btn');
            btn.disabled = true;
            btn.textContent = "Posting...";

            try {
                await addDoc(collection(db, "comments"), {
                    postId: postId,
                    userId: auth.currentUser.uid,
                    authorName: auth.currentUser.displayName || "Anonymous",
                    authorPic: auth.currentUser.photoURL || "",
                    text: text,
                    date: serverTimestamp()
                });
                textInput.value = '';
            } catch (error) {
                alert("Error posting comment: " + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Post Comment";
            }
        };

        function loadComments() {
            const commentsList = document.getElementById('comments-list');
            if (!postId) return;
            
            const q = query(collection(db, "comments"), where("postId", "==", postId), orderBy("date", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    commentsList.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-sm">No comments yet. Be the first to start the discussion!</p>';
                    return;
                }

                let html = '';
                snapshot.forEach((doc) => {
                    const comment = doc.data();
                    const date = comment.date ? new Date(comment.date.toDate()).toLocaleDateString() : 'Just now';
                    const picUrl = comment.authorPic ? comment.authorPic : `https://ui-avatars.com/api/?name=${comment.authorName}&background=random`;
                    
                    html += `
                        <div class="flex space-x-4 mb-6">
                            <img src="${picUrl}" alt="${comment.authorName}" class="w-10 h-10 rounded-full border border-gray-200 dark:border-[#444]">
                            <div class="flex-1 bg-gray-50 dark:bg-[#18191a] p-4 rounded-lg border border-gray-200 dark:border-[#3a3b3c]">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="font-bold text-gray-900 dark:text-white text-sm">${comment.authorName}</h4>
                                    <span class="text-xs text-gray-500 dark:text-gray-400">${date}</span>
                                </div>
                                <p class="text-gray-700 dark:text-gray-300 text-sm whitespace-pre-wrap">${comment.text}</p>
                            </div>
                        </div>
                    `;
                });
                commentsList.innerHTML = html;
            });
        }

        window.onload = loadSinglePost;
    </script>
</head>
<body class="bg-[#fafafa] dark:bg-[#1d1e20] text-gray-900 dark:text-[#a9a9b3] min-h-screen flex flex-col transition-colors duration-300">

    <header class="max-w-3xl w-full mx-auto px-6 py-6 flex justify-between items-center border-b border-gray-200 dark:border-[#333]">
        <a href="/blog/" class="text-xl font-bold text-gray-900 dark:text-white hover:opacity-80">← Back to Blog</a>
        <button onclick="toggleTheme()" class="p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-800 transition">
            <svg class="w-5 h-5 text-gray-800 dark:text-gray-200 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
            <svg class="w-5 h-5 text-gray-800 dark:text-gray-200 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
        </button>
    </header>

    <main class="max-w-3xl w-full mx-auto px-6 py-10 flex-grow">
        <!-- The Blog Post -->
        <article id="post-container" class="bg-white dark:bg-[#242526] p-8 rounded-lg border border-gray-200 dark:border-[#3a3b3c] shadow-sm mb-10">
            <div class="animate-pulse space-y-4">
                <div class="h-8 bg-gray-200 dark:bg-[#333] rounded w-3/4 mb-4"></div>
                <div class="h-4 bg-gray-200 dark:bg-[#333] rounded w-full"></div>
                <div class="h-4 bg-gray-200 dark:bg-[#333] rounded w-5/6"></div>
            </div>
        </article>

        <!-- Custom Firebase Comment Section -->
        <div class="bg-white dark:bg-[#242526] p-8 rounded-lg border border-gray-200 dark:border-[#3a3b3c] shadow-sm">
            <div class="flex justify-between items-center mb-6 border-b border-gray-200 dark:border-[#3a3b3c] pb-4">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white">Discussion</h3>
                
                <!-- User Login/Info Display -->
                <button id="login-btn" onclick="loginWithGoogle()" class="bg-white dark:bg-[#242526] border border-gray-300 dark:border-[#444] text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-[#2a2b2c] font-medium py-1.5 px-4 rounded shadow-sm text-sm transition flex items-center gap-2">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Sign in with Google
                </button>
                <div id="user-info" class="hidden flex items-center gap-3 text-sm">
                    <span class="text-gray-600 dark:text-gray-400">Commenting as <strong id="user-name" class="text-gray-900 dark:text-white"></strong></span>
                    <button onclick="logout()" class="text-red-500 hover:underline text-xs">Sign Out</button>
                </div>
            </div>

            <!-- Comment Input Form -->
            <form id="comment-form" onsubmit="submitComment(event)" class="hidden mb-8">
                <textarea id="comment-text" required rows="3" placeholder="Add to the discussion..." class="w-full bg-gray-50 dark:bg-[#18191a] border border-gray-300 dark:border-[#3a3b3c] rounded-lg p-3 text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 transition mb-3 resize-none"></textarea>
                <div class="flex justify-end">
                    <button id="submit-comment-btn" type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200 text-sm">
                        Post Comment
                    </button>
                </div>
            </form>

            <!-- Rendered Comments -->
            <div id="comments-list" class="space-y-4 mt-4">
                <p class="text-gray-500 text-sm animate-pulse">Loading comments...</p>
            </div>
        </div>
    </main>
</body>
</html>
