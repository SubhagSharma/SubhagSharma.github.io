<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin | Subhag Sharma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Quill.js Rich Text Editor CSS and JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <style>
        /* Styling the editor to look clean inside the dark theme */
        .ql-toolbar { background-color: #f3f4f6; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; border: none !important; }
        .ql-container { background-color: #ffffff; color: #000000; font-size: 16px; border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; height: 300px; border: none !important; }
        .ql-editor { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ⚠️ CRITICAL: Replace with your actual Firebase config keys ⚠️
        const firebaseConfig = {

    apiKey: "AIzaSyBjIgZGfD-BXW8f0t7MKis0MULrOQPZPPE",

    authDomain: "subhag-blog.firebaseapp.com",

    projectId: "subhag-blog",

    storageBucket: "subhag-blog.firebasestorage.app",

    messagingSenderId: "467758922508",

    appId: "1:467758922508:web:a554e5e042fe5472c9e729",

    measurementId: "G-MFQS21SR9B"

  };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Initialize Quill Editor once the DOM is loaded
        let quill;
        document.addEventListener("DOMContentLoaded", () => {
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Write your post here...',
                modules: {
                    toolbar: [
                        [{ 'font': [] }, { 'size': ['small', false, 'large', 'huge'] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link', 'clean']
                    ]
                }
            });
        });

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            const loginSection = document.getElementById('login-section');
            const editorSection = document.getElementById('editor-section');
            const userEmail = document.getElementById('user-email');

            if (user) {
                loginSection.classList.add('hidden');
                editorSection.classList.remove('hidden');
                userEmail.textContent = user.email;
            } else {
                loginSection.classList.remove('hidden');
                editorSection.classList.add('hidden');
            }
        });

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            try {
                errorEl.textContent = '';
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorEl.textContent = "Authentication failed: " + error.message;
            }
        });

        // Handle Sign Out
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // Handle Publish Post
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('post-title').value;
            // Get the HTML content directly from Quill
            const content = quill.root.innerHTML; 
            const statusEl = document.getElementById('post-status');

            if (quill.getText().trim().length === 0) {
                statusEl.className = "text-red-400 font-medium";
                statusEl.textContent = "Post content cannot be empty.";
                return;
            }

            try {
                statusEl.className = "text-blue-400 font-medium";
                statusEl.textContent = "Publishing...";

                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    date: serverTimestamp()
                });

                statusEl.className = "text-green-400 font-medium";
                statusEl.textContent = "Post published successfully!";
                document.getElementById('post-form').reset();
                quill.setContents([]); // Clear the editor
            } catch (error) {
                statusEl.className = "text-red-400 font-medium";
                statusEl.textContent = "Error publishing post: " + error.message;
            }
        });
    </script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Login Form -->
    <div id="login-section" class="w-full max-w-md bg-gray-950 p-8 rounded-xl border border-gray-800 shadow-2xl">
        <h1 class="text-2xl font-bold text-white mb-6 text-center">Blog Admin Sign In</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-70
